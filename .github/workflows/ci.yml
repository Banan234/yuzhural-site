# Файл описывает CI-пайплайн GitHub Actions: установку зависимостей, проверки, сборку и тесты проекта.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Отменяем предыдущие прогоны на той же ветке/PR при новом пуше — экономит минуты.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, production pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      FORMS_ENABLED: 'false'
      SITE_URL: https://example.com
      VITE_SITE_URL: https://example.com
      VITE_YANDEX_METRIKA_ID: ''
      VITE_SENTRY_DSN: ''
      VITE_SENTRY_ENVIRONMENT: production
      VITE_SENTRY_RELEASE: ci-${{ github.sha }}
      VITE_SENTRY_TRACES_SAMPLE_RATE: '0'
      PUBLIC_ARTIFACTS_DIR: data/public
      PRERENDER_TEMPLATE_DIR: dist
      PRODUCT_PRERENDER_LIMIT: '720'
      PRODUCT_PRERENDER_INCLUDE: ''

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (npm)
        run: npx --yes audit-ci@^7 --config ./audit-ci.jsonc

      - name: Prettier check
        run: npm run format:check

      - name: Tests (vitest)
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (playwright)
        run: npm run e2e

      - name: Build production pipeline
        run: npm run build:prod

      - name: Verify runtime artifact sync outputs
        run: |
          test -f data/public/sitemap.xml
          test -f data/public/robots.txt
          test -d data/public/product

      - name: Verify product prerender coverage
        run: npm run check:product-prerender
