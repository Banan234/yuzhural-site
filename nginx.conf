# Файл настраивает production nginx для раздачи статики, SPA fallback, кеширования и проксирования API.

# Nginx-конфигурация для production-контейнера web (см. Dockerfile, target=web).
# Слушает 80, отдаёт SPA из /usr/share/nginx/html, проксирует /api/* на app:3001.

upstream api_upstream {
    # `app` — имя сервиса в docker-compose.yml.
    server app:3001;
    keepalive 32;
}

# Кэш-стратегия для длинных ассетов с хешами в имени (vite ставит Cache-Control).
map $sent_http_content_type $static_immutable {
    default                 "";
    ~application/javascript "public, max-age=31536000, immutable";
    ~text/css               "public, max-age=31536000, immutable";
    ~font/                  "public, max-age=31536000, immutable";
    ~image/                 "public, max-age=2592000";
}

# За внешним TLS reverse proxy внутренний Nginx всегда видит plain HTTP.
# Сохраняем исходный протокол из X-Forwarded-Proto для app upstream и
# выключаем absolute redirects, чтобы Location не деградировал до http://.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    ~*^https?$ $http_x_forwarded_proto;
}

# Finite catalog pagination is rendered with its immutable data release.
# Search/filter/sort variants retain the T10 loading shell and are noindex.
map $args $catalog_semantic_dynamic {
    default 0;
    ~*(?:^|&)(?:search|category|mark|priceMin|priceMax|material|construction|cores|section|voltage|powerGroup|appType|spe)= 1;
    ~*(?:^|&)sort=(?!default(?:&|$)) 1;
    ~*(?:^|&)limit=(?!24(?:&|$)) 1;
    '~(?:^|&)(?<catalog_duplicate>[^=&]+)=[^&]*(?:&[^&]*)*&\k<catalog_duplicate>=' 1;
}
# Unknown/encoded parameter names must not hydrate page one as another query.
map $args $catalog_unknown_query {
    default 1;
    "" 0;
    '~^(?:(?:page|sort|limit|search|category|mark|priceMin|priceMax|material|construction|cores|section|voltage|powerGroup|appType|spe|utm_[a-z0-9_]+|gclid|yclid|_openstat|from)(?:=[^&]*)?)(?:&(?:page|sort|limit|search|category|mark|priceMin|priceMax|material|construction|cores|section|voltage|powerGroup|appType|spe|utm_[a-z0-9_]+|gclid|yclid|_openstat|from)(?:=[^&]*)?)*$' 0;
}
map "$catalog_semantic_dynamic:$catalog_unknown_query" $catalog_dynamic {
    default 1;
    "0:0" 0;
}
map $arg_page $catalog_page_file {
    default invalid.html;
    "" index.html;
    "1" index.html;
    ~^[1-9][0-9]*$ page-$arg_page.html;
}
map $args $catalog_empty_page {
    default 0;
    ~(?:^|&)page=(?:&|$) 1;
}
map $arg_page $catalog_invalid_page {
    default 1;
    "" 0;
    ~^[1-9][0-9]*$ 0;
}
map $catalog_dynamic $catalog_entry_html {
    default $catalog_page_file;
    1 query.html;
}
map "$request_uri:$catalog_dynamic" $catalog_robots {
    default "";
    ~^/catalog(?:/|\?|$).*:1$ "noindex, follow";
}
map $args $catalog_normalized_0 {
    default $args;
    ~^page=1$ "";
    ~^page=1&(?<cat_post_0>.+)$ $cat_post_0;
    ~^(?<cat_pre_0>.+)&page=1$ $cat_pre_0;
    ~^(?<cat_pre_0mid>.+)&page=1&(?<cat_post_0mid>.+)$ ${cat_pre_0mid}&${cat_post_0mid};
}
map $catalog_normalized_0 $catalog_normalized_1 {
    default $catalog_normalized_0;
    ~^sort=default$ "";
    ~^sort=default&(?<cat_post_1>.+)$ $cat_post_1;
    ~^(?<cat_pre_1>.+)&sort=default$ $cat_pre_1;
    ~^(?<cat_pre_1mid>.+)&sort=default&(?<cat_post_1mid>.+)$ ${cat_pre_1mid}&${cat_post_1mid};
}
map $catalog_normalized_1 $catalog_normalized_2 {
    default $catalog_normalized_1;
    ~^limit=24$ "";
    ~^limit=24&(?<cat_post_2>.+)$ $cat_post_2;
    ~^(?<cat_pre_2>.+)&limit=24$ $cat_pre_2;
    ~^(?<cat_pre_2mid>.+)&limit=24&(?<cat_post_2mid>.+)$ ${cat_pre_2mid}&${cat_post_2mid};
}
map $catalog_normalized_2 $catalog_normalized_args { default $catalog_normalized_2; }
map $catalog_normalized_args $catalog_normalized_suffix {
    "" "";
    default ?$catalog_normalized_args;
}
map $catalog_normalized_args $catalog_without_category {
    default $catalog_normalized_args;
    ~^category=[^&]*$ "";
    ~^category=[^&]*&(?<cat_tail>.+)$ $cat_tail;
    ~^(?<cat_head>.+)&category=[^&]*$ $cat_head;
    ~^(?<cat_head_mid>.+)&category=[^&]*&(?<cat_tail_mid>.+)$ ${cat_head_mid}&${cat_tail_mid};
}
map $catalog_without_category $catalog_category_suffix {
    "" "";
    default ?$catalog_without_category;
}
# Only known category aliases become redirects; never interpolate arbitrary paths.
map "$uri:$arg_category" $catalog_category_redirect {
    default "";
    "/catalog/:bortovye-provoda" /catalog/bortovye-provoda;
    "/catalog/:gibkiy-kabel" /catalog/gibkiy-kabel;
    "/catalog/:greyushchie-rezistivnye-kabeli" /catalog/greyushchie-rezistivnye-kabeli;
    "/catalog/:importnye-drugie-kabeli" /catalog/importnye-drugie-kabeli;
    "/catalog/:importnye-gibkie-kabeli" /catalog/importnye-gibkie-kabeli;
    "/catalog/:importnye-kabeli" /catalog/importnye-kabeli;
    "/catalog/:importnye-kabeli-signalizacii" /catalog/importnye-kabeli-signalizacii;
    "/catalog/:importnye-kabeli-sudovye" /catalog/importnye-kabeli-sudovye;
    "/catalog/:importnye-kabeli-svyazi" /catalog/importnye-kabeli-svyazi;
    "/catalog/:importnye-kontrolnye-kabeli" /catalog/importnye-kontrolnye-kabeli;
    "/catalog/:importnye-lan-kabeli" /catalog/importnye-lan-kabeli;
    "/catalog/:importnye-montazhnye-kabeli" /catalog/importnye-montazhnye-kabeli;
    "/catalog/:importnye-provoda" /catalog/importnye-provoda;
    "/catalog/:importnye-silovye-kabeli" /catalog/importnye-silovye-kabeli;
    "/catalog/:kabel-i-provod" /catalog/kabel-i-provod;
    "/catalog/:kabel-upravleniya" /catalog/kabel-upravleniya;
    "/catalog/:kabel-vodopogr" /catalog/kabel-vodopogr;
    "/catalog/:kabeli-nagrevatelnye" /catalog/kabeli-nagrevatelnye;
    "/catalog/:kabeli-neftepogr" /catalog/kabeli-neftepogr;
    "/catalog/:kabeli-peredachi-dannykh" /catalog/kabeli-peredachi-dannykh;
    "/catalog/:kabeli-podvizhnogo-sostava" /catalog/kabeli-podvizhnogo-sostava;
    "/catalog/:kabeli-pozharnoy-signalizacii" /catalog/signalno-blokirovochnye;
    "/catalog/:kabeli-shakhtnye" /catalog/kabeli-shakhtnye;
    "/catalog/:kabeli-sudovye" /catalog/kabeli-sudovye;
    "/catalog/:kabeli-svyazi" /catalog/kabeli-svyazi;
    "/catalog/:kabeli-termoparny" /catalog/kabeli-termoparny;
    "/catalog/:koaksialnye-kabeli" /catalog/koaksialnye-kabeli;
    "/catalog/:kontrolnye-kabeli" /catalog/kontrolnye-kabeli;
    "/catalog/:kontrolnyy-kabel" /catalog/kontrolnyy-kabel;
    "/catalog/:kontrolnyy-kabel-alyuminievyy" /catalog/kontrolnye-kabeli;
    "/catalog/:kontrolnyy-kabel-mednyy" /catalog/kontrolnye-kabeli;
    "/catalog/:lan-kabeli" /catalog/lan-kabeli;
    "/catalog/:montazhnyy-kabel" /catalog/montazhnyy-kabel;
    "/catalog/:optovolokonnye-kabeli" /catalog/optovolokonnye-kabeli;
    "/catalog/:prochee" /catalog/prochee;
    "/catalog/:provoda" /catalog/provoda;
    "/catalog/:provoda-avtomobilnye" /catalog/provoda-avtomobilnye;
    "/catalog/:provoda-montazhnye" /catalog/provoda-montazhnye;
    "/catalog/:provoda-neizolirovannye" /catalog/provoda-neizolirovannye;
    "/catalog/:provoda-obmotochnye" /catalog/provoda-obmotochnye;
    "/catalog/:provoda-podvizhnogo-sostava" /catalog/provoda-podvizhnogo-sostava;
    "/catalog/:provoda-progrevochnye" /catalog/provoda-progrevochnye;
    "/catalog/:provoda-soedinitelnye" /catalog/provoda-soedinitelnye;
    "/catalog/:provoda-svyazi" /catalog/provoda-svyazi;
    "/catalog/:provoda-termoelektrodnye" /catalog/provoda-termoelektrodnye;
    "/catalog/:provoda-termostoykie" /catalog/provoda-termostoykie;
    "/catalog/:provoda-ustanovochnye" /catalog/provoda-ustanovochnye;
    "/catalog/:provoda-vyvodnye" /catalog/provoda-vyvodnye;
    "/catalog/:samoreguliruyushchiesya-kabeli" /catalog/samoreguliruyushchiesya-kabeli;
    "/catalog/:signalno-blokirovochnye" /catalog/signalno-blokirovochnye;
    "/catalog/:silovoy-kabel" /catalog/silovoy-kabel;
    "/catalog/:silovoy-kabel-bronirovannyy" /catalog/silovoy-kabel-bronirovannyy;
    "/catalog/:silovoy-kabel-bumazhnaya-izolyaciya" /catalog/silovoy-kabel-bumazhnaya-izolyaciya;
    "/catalog/:silovoy-kabel-polimernye-kompozicii" /catalog/silovoy-kabel-polimernye-kompozicii;
    "/catalog/:silovoy-kabel-pvh" /catalog/silovoy-kabel-pvh;
    "/catalog/:silovoy-kabel-rezinovaya-izolyaciya" /catalog/silovoy-kabel-rezinovaya-izolyaciya;
    "/catalog/:silovoy-kabel-spe" /catalog/silovoy-kabel-spe;
    "/catalog/:sip" /catalog/sip;
    "/catalog/:soedinitelnyy-kabel" /catalog/prochee;
    "/catalog/:specialnye-kabeli" /catalog/specialnye-kabeli;
    "/catalog/:universalnye-kabeli" /catalog/universalnye-kabeli;
}


server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;
    more_clear_headers Server;

    # CSP для SPA. Inline script запрещён; JSON-LD вставляется как
    # application/ld+json, а executable-скрипты разрешены только с self/Метрики.
    # Yandex map widgets на /contacts и /delivery требуют iframe только с
    # yandex.ru / yandex.com, поэтому frame-src открыт точечно под эти origins.
    # Inline style пока нужен для текущих React style={{...}}.
    set $site_csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://mc.yandex.ru https://api-maps.yandex.ru https://*.maps.yandex.net; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.maps.yandex.net https://*.maps.yandex.ru https://api-maps.yandex.ru https://mc.yandex.ru https://*.mc.yandex.ru; font-src 'self'; connect-src 'self' https://mc.yandex.ru https://*.mc.yandex.ru https://*.ingest.sentry.io https://*.sentry.io https://*.maps.yandex.net https://*.maps.yandex.ru https://api-maps.yandex.ru; frame-src https://yandex.ru https://yandex.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self'";
    set $api_csp "default-src 'none'; base-uri 'none'; connect-src 'self'; font-src 'none'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; img-src 'none'; manifest-src 'none'; media-src 'none'; object-src 'none'; script-src 'none'; script-src-attr 'none'; style-src 'none'; worker-src 'none'";

    # Brotli-модули загружаются в Dockerfile в main nginx.conf. Brotli отдаётся
    # клиентам с Accept-Encoding: br, gzip остаётся fallback для старых клиентов.
    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types
        text/html
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # Включаем gzip на текстовом контенте. Бинарь vite уже сжимает на этапе build,
    # но gzip-ответ на лету для index.html / json остаётся полезным.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # Базовая защита заголовков.
    add_header Content-Security-Policy $site_csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header X-Robots-Tag $catalog_robots always;

    # Liveness-проба самого Nginx — без обращения к API.
    # Используется и Docker HEALTHCHECK, и внешним балансировщиком.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }

    # Прокси на Express API.
    location /api/ {
        # Спецификации: 3 × 5 МБ плюс multipart. Остальные payload ограничены Express.
        client_max_body_size 16m;
        add_header Content-Security-Policy $api_csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header Server;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Powered-By;
        proxy_set_header Connection        "";
        proxy_read_timeout 30s;
        proxy_pass http://api_upstream;
    }

    # Статика vite: длинный кэш только для /assets/* (имена с хешем).
    # index.html и /fonts/, /documents/ не кэшируем агрессивно — иначе старые
    # клиенты будут грузить устаревший манифест.
    location /assets/ {
        expires 1y;
        # add_header в location сбрасывает наследование server-level headers,
        # поэтому security headers здесь продублированы явно.
        add_header Content-Security-Policy $site_csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        more_set_headers "Cache-Control: public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Стабильные публичные ассеты из public/: не хешируются vite, но редко
    # меняются и безопасны для долгого браузерного кэша.
    location ~ ^/(hero-bg[^/]*\.(?:avif|webp)|logo\.(?:webp|png)|favicon-32\.png|favicon\.ico|product-placeholder\.svg|category-placeholders/[A-Za-z0-9-]+\.svg|fonts/[A-Za-z0-9._-]+)$ {
        expires 1y;
        add_header Content-Security-Policy $site_csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        more_set_headers "Cache-Control: public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Файлы, которые могут обновляться runtime-импортом прайса без пересборки
    # web-образа. Если runtime-файла ещё нет, используем fallback из dist/.
    location ~ ^/(robots\.txt|sitemap(?:-[A-Za-z0-9-]+)?\.xml|price\.xls)$ {
        root /usr/share/nginx;
        add_header Content-Security-Policy $site_csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cache-Control "no-cache";
        try_files /runtime-data/catalog-current/public/$1 /runtime-data/public-current/$1 /runtime-data/public/$1 /html/$1 =404;
    }

    # 301-редиректы для переименованных карточек товара.
    # Подключаем только конфиг из immutable web-образа, а не из runtime-data:
    # runtime volume содержит данные импорта, но не должен исполняться nginx.
    # Glob-include не падает, если файла нет (свежая инсталляция без импорта).
    include /usr/share/nginx/html/redirects.nginx.conf*;

    # Для неизвестных URL отдаём отдельный 404-shell с корректным head, а не
    # общий index.html главной страницы.
    error_page 404 /404.html;

    location = /404.html {
        internal;
        try_files /404.html =404;
    }

    # Базовые статические страницы канонизируем со trailing slash. Используем
    # relative Location, чтобы внешний TLS proxy сохранил https-схему.
    location ~ ^/(catalog|contacts|delivery|payment|about)$ {
        return 308 /$1/$is_args$args;
    }

    location ~ ^/(catalog|contacts|delivery|payment|about)/+$ {
        return 308 /$1/;
    }

    location ~ ^/catalog/([A-Za-z0-9-]+)/+$ {
        return 308 /catalog/$1$is_args$args;
    }

    location = /catalog/soedinitelnyy-kabel {
        return 301 /catalog/prochee$is_args$args;
    }

    location = /catalog/soedinitelnyy-kabel/ {
        return 301 /catalog/prochee$is_args$args;
    }

    location = /catalog/kabeli-pozharnoy-signalizacii {
        return 301 /catalog/signalno-blokirovochnye$is_args$args;
    }

    location = /catalog/kabeli-pozharnoy-signalizacii/ {
        return 301 /catalog/signalno-blokirovochnye$is_args$args;
    }

    location = /catalog/kontrolnyy-kabel-alyuminievyy {
        return 301 /catalog/kontrolnye-kabeli$is_args$args;
    }

    location = /catalog/kontrolnyy-kabel-alyuminievyy/ {
        return 301 /catalog/kontrolnye-kabeli$is_args$args;
    }

    location = /catalog/kontrolnyy-kabel-mednyy {
        return 301 /catalog/kontrolnye-kabeli$is_args$args;
    }

    location = /catalog/kontrolnyy-kabel-mednyy/ {
        return 301 /catalog/kontrolnye-kabeli$is_args$args;
    }

    location ~ ^/product/([A-Za-z0-9-]+)/+$ {
        return 308 /product/$1$is_args$args;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /catalog/ {
        if ($catalog_invalid_page) { return 404; }
        if ($catalog_empty_page) { return 404; }
        if ($catalog_category_redirect) { return 308 $catalog_category_redirect$catalog_category_suffix; }
        if ($args != $catalog_normalized_args) { return 308 $uri$catalog_normalized_suffix; }
        if (-f /usr/share/nginx/runtime-data/catalog-current/products.json) {
            rewrite ^ /__active-catalog-page/_root/$catalog_entry_html last;
        }
        try_files /catalog/$catalog_entry_html =404;
    }

    location = /about/ {
        try_files /about/index.html =404;
    }

    location = /contacts/ {
        try_files /contacts/index.html =404;
    }

    location = /delivery/ {
        try_files /delivery/index.html =404;
    }

    location = /payment/ {
        try_files /payment/index.html =404;
    }

    location = /privacy {
        try_files /privacy/index.html =404;
    }

    # Only known application pages may resolve to a generated index.html.
    # Keep the allowlist anchored: unknown service/calculator URLs stay 404.
    location ~ ^/(marks|specification|how-to-order|quality|services(?:/(?:application|marking|reference|analogs|drum|shipping|manufacturers))?|calculator/(?:section|weight)|oferta)$ {
        return 308 /$1/$is_args$args;
    }

    location ~ ^/(marks|specification|how-to-order|quality|services(?:/(?:application|marking|reference|analogs|drum|shipping|manufacturers))?|calculator/(?:section|weight)|oferta)/$ {
        try_files /$1/index.html =404;
    }

    location = /personal-data-consent {
        try_files /personal-data-consent/index.html =404;
    }

    location ~ ^/(privacy|personal-data-consent|cart|internal/runtime)/+$ {
        return 308 /$1$is_args$args;
    }

    # Корзина остаётся клиентским SPA-route: прямой заход разрешаем,
    # но только для этого известного URL, без общего wildcard-fallback.
    location = /cart {
        try_files /cart/index.html =404;
    }

    # Внутренняя диагностика остаётся точечным SPA-route: прямой заход
    # разрешаем только для этого URL, без общего wildcard-fallback.
    location = /internal/runtime {
        try_files /internal/runtime/index.html =404;
    }

    location ~ ^/catalog/(?<catalog_route_slug>[A-Za-z0-9-]+)$ {
        if ($catalog_invalid_page) { return 404; }
        if ($catalog_empty_page) { return 404; }
        if ($catalog_category_redirect) { return 308 $catalog_category_redirect$catalog_category_suffix; }
        if ($args != $catalog_normalized_args) { return 308 $uri$catalog_normalized_suffix; }
        if (-f /usr/share/nginx/runtime-data/catalog-current/products.json) {
            rewrite ^ /__active-catalog-page/$catalog_route_slug/$catalog_entry_html last;
        }
        try_files /catalog/$catalog_route_slug/$catalog_entry_html =404;
    }

    # Active catalog pages must not fall back to stale image HTML.
    location ~ ^/__active-catalog-page/_root/(?<catalog_root_file>index|query|page-[1-9][0-9]*)\.html$ {
        internal;
        root /usr/share/nginx;
        try_files /runtime-data/catalog-current/public/catalog/$catalog_root_file.html =404;
    }
    location ~ ^/__active-catalog-page/(?<catalog_category_name>[A-Za-z0-9-]+)/(?<catalog_category_file>index|query|page-[1-9][0-9]*)\.html$ {
        internal;
        root /usr/share/nginx;
        try_files /runtime-data/catalog-current/public/catalog/$catalog_category_name/$catalog_category_file.html =404;
    }

    # Product prerender хранится плоско: /product/<slug>.html.
    # Так не создаём 6 700+ директорий /product/<slug>/index.html в Docker layer,
    # но публичные URL остаются прежними: /product/<slug>. Runtime-импорт
    # обязан закрыть все product URL из sitemap; при отсутствии HTML-артефакта
    # отдаём реальный 404.
    location ~ ^/product/([A-Za-z0-9-]+)$ {
        root /usr/share/nginx;
        set $catalog_product_slug $1;
        # Route active releases separately: never revive a removed SKU from fallback.
        if (-f /usr/share/nginx/runtime-data/catalog-current/products.json) {
            rewrite ^ /__active-catalog-product/$catalog_product_slug last;
        }
        try_files /runtime-data/catalog-current/public/product/$catalog_product_slug.html /runtime-data/public-current/product/$catalog_product_slug.html /runtime-data/public/product/$catalog_product_slug.html /html/product/$catalog_product_slug.html =404;
    }

    location ~ ^/__active-catalog-product/([A-Za-z0-9-]+)$ {
        internal;
        root /usr/share/nginx;
        try_files /runtime-data/catalog-current/public/product/$1.html =404;
    }

    # Всё остальное не считаем валидным роутом и не подменяем главной страницей.
    location / {
        try_files $uri =404;
    }
}
