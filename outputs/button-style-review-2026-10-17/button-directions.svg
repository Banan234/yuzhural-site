<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc">
  <title id="title">Три варианта кнопок для главной ЮжУралЭлектроКабель</title>
  <desc id="desc">Сравнение прямых, умеренно скруглённых и мягких кнопок на первом экране и в карточке товара.</desc>
  <rect width="1040" height="650" fill="#f5f7f9"/>
